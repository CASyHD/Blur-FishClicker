<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay</title>
    <style>
        @font-face {
            font-family: 'RobotoFlex';
            src: url('/fonts/RobotoFlex.ttf') format('truetype');
            font-weight: 100 1000;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
            font-variant-numeric: tabular-nums;
        }
        .overlay-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .zone {
            position: absolute;
            pointer-events: none;
            border: 2px solid;
        }
        .zone-edge {
            background: rgba(0, 200, 255, 0.3);
            border-color: rgba(0, 200, 255, 0.8);
        }
        .zone-corner {
            background: rgba(255, 80, 80, 0.4);
            border-color: rgba(255, 80, 80, 0.9);
        }
        .zone-custom {
            background: rgba(255, 196, 0, 0.18);
            border-color: rgba(255, 196, 0, 0.92);
            border-style: dashed;
        }
        .zone-pause {
            background: rgba(0, 180, 255, 0.18);
            border-color: rgba(0, 180, 255, 0.92);
            border-style: solid;
        }
        .zone-start {
            background: rgba(34, 197, 94, 0.18);
            border-color: rgba(34, 197, 94, 0.92);
            border-style: solid;
        }
        .zone-disabled {
            background: rgba(128, 128, 128, 0.15);
            border-color: rgba(128, 128, 128, 0.5);
            border-style: dashed;
        }
        .zone-monitor {
            background: transparent;
            border-color: rgba(255, 255, 255, 0.28);
            border-style: solid;
        }
        #overlay-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .click-points-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 999px;
            border: 2px solid rgba(255, 255, 255, 0.86);
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.28), 0 6px 18px rgba(0, 0, 0, 0.35);
            pointer-events: none;
        }
        .click-points-radius {
            position: absolute;
            border-radius: 50%;
            border: 2px dashed;
            pointer-events: none;
            opacity: 0.55;
        }
        .overlay-prompt {
            position: absolute;
            max-width: 260px;
            padding: 9px 11px;
            border-radius: 8px;
            background: rgb(12, 12, 14);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.36);
            color: rgba(255, 255, 255, 0.92);
            font: 600 13px/1.32 "RobotoFlex", "Segoe UI", sans-serif;
            pointer-events: none;
            opacity: 0;
            transition: opacity 120ms ease;
        }
        .overlay-prompt.active {
            opacity: 1;
        }
        .overlay-prompt span {
            display: block;
            color: rgba(255, 255, 255, 0.66);
            font-weight: 500;
            margin-top: 3px;
        }
        .zone-drawing-preview {
            background: rgba(34, 197, 94, 0.14);
            border-color: rgba(34, 197, 94, 0.95);
            border-style: dashed;
        }
        .zone--labeled {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .zone-label {
            font-family: "RobotoFlex", sans-serif;
            font-size: 10rem;
            font-weight: 800;
            line-height: 1;
            user-select: none;
        }
        .zone-custom .zone-label { color: rgba(255, 196, 0, 0.55); }
        .zone-pause .zone-label  { color: rgba(0, 180, 255, 0.55); }
        .zone-start .zone-label  { color: rgba(34, 197, 94, 0.55); }
        .zone-disabled .zone-label { color: rgba(128, 128, 128, 0.55); }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }
        .fade-out {
            animation: fadeOut 5s ease forwards;
        }

        /* ---- Pixel trigger preview ----
           Nothing is ever drawn ON a sampled pixel row/pixel, otherwise the
           overlay could feed back into the detection. Lines are shown as a
           band (one stroke above, one below), pixels as hollow rings. */
        .pt-stroke {
            position: absolute;
            height: 2px;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.65);
            border-radius: 1px;
        }
        .pt-cap {
            position: absolute;
            width: 0;
            border-left: 2px dashed rgba(255, 255, 255, 0.75);
            filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.9));
        }
        .pt-label {
            position: absolute;
            font-family: "RobotoFlex", sans-serif;
            font-size: 12px;
            font-weight: 800;
            color: #fff;
            background: rgba(0, 0, 0, 0.72);
            border-radius: 4px;
            padding: 1px 5px;
            white-space: nowrap;
            transform: translateY(-50%);
        }
        .pt-tick {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
        }
        .pt-ring {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(0, 0, 0, 0.7);
        }
        .pt-click {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #ffc400;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7);
        }
        .pt-click::before, .pt-click::after {
            content: "";
            position: absolute;
            background: #ffc400;
        }
        .pt-click::before { left: 9px; top: -7px; width: 2px; height: 32px; }
        .pt-click::after { top: 9px; left: -7px; height: 2px; width: 32px; }
        .pt-click.pt-recast { border-color: #c084fc; }
        .pt-click.pt-recast::before, .pt-click.pt-recast::after { background: #c084fc; }
        .pt-status {
            position: absolute;
            font-family: "RobotoFlex", sans-serif;
            font-size: 12px;
            font-weight: 800;
            border-radius: 999px;
            padding: 2px 8px;
            transform: translateY(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.72);
        }
        .pt-status.on { background: rgb(34, 160, 60); }

    </style>
</head>
<body>
    <div id="overlay-container">
        <div id="zone-layer" class="overlay-layer"></div>
        <div id="click-points-layer" class="overlay-layer"></div>
        <div id="pixel-trigger-layer" class="overlay-layer"></div>
        <div id="pick-prompt" class="overlay-prompt">
            Right click to add point.
            <span>Shift + right click to add multiple.</span>
            <span>Ctrl + right click to delete a point.</span>
            <span>Esc to cancel.</span>
        </div>
        <div id="stop-zone-prompt" class="overlay-prompt">
            Right click and drag to draw stop zone.
            <span>Release to save.</span>
            <span>Esc to cancel.</span>
        </div>
    </div>

    <script>
        const zoneLayer = document.getElementById('zone-layer');
        const clickPointsLayer = document.getElementById('click-points-layer');
        const pixelTriggerLayer = document.getElementById('pixel-trigger-layer');
        const pickPrompt = document.getElementById('pick-prompt');
        const stopZonePrompt = document.getElementById('stop-zone-prompt');
        let pickModeActive = false;
        let stopZonePickModeActive = false;
        let zoneFadeAnim = null;
        let hasFadedIn = false;

        async function setupTauriListener() {
            if (!window.__TAURI__ || !window.__TAURI__.event) {
                console.log('[Overlay] Tauri not ready, retrying...');
                setTimeout(setupTauriListener, 200);
                return;
            }

            const tauriEvent = window.__TAURI__.event;

            try {
                await Promise.all([
                    tauriEvent.listen('zone-data', (event) => {
                        renderZones(event.payload);
                    }),

                    tauriEvent.listen('clear-zones', () => {
                        zoneLayer.innerHTML = '';
                        if (zoneFadeAnim) {
                            zoneFadeAnim.cancel();
                            zoneFadeAnim = null;
                        }
                    }),

                    tauriEvent.listen('click-points-data', (event) => {
                        renderClickPoints(event.payload);
                    }),

                    tauriEvent.listen('click-pick-mode', (event) => {
                        setPickMode(Boolean(event.payload && event.payload.active));
                    }),

                    tauriEvent.listen('click-pick-cursor', (event) => {
                        updatePickPrompt(event.payload);
                    }),

                    tauriEvent.listen('custom-stop-zone-pick-mode', (event) => {
                        setStopZonePickMode(Boolean(event.payload && event.payload.active));
                    }),

                    tauriEvent.listen('custom-stop-zone-preview', (event) => {
                        renderStopZonePreview(event.payload);
                    }),

                    tauriEvent.listen('custom-stop-zone-clear-preview', () => {
                        clearStopZonePreview();
                    }),

                    tauriEvent.listen('pixel-trigger-data', (event) => {
                        renderPixelTrigger(event.payload);
                    })
                ]);
            } catch (error) {
                console.log('[Overlay] Listener registration failed', error);
                return;
            }

            await tauriEvent.emit('overlay-ready').catch((error) => {
                console.log('[Overlay] Ready emit failed', error);
            });
            console.log('[Overlay] Event listeners registered');
        }

        function renderZones(data) {
            zoneLayer.innerHTML = '';
            if (zoneFadeAnim) {
                if (zoneFadeAnim.playState === 'finished') {
                    hasFadedIn = false;
                }
                zoneFadeAnim.cancel();
                zoneFadeAnim = null;
            }

            if (!data) return;

            if (!stopZonePickModeActive) {
                zoneFadeAnim = zoneLayer.animate([
                    { opacity: 1 },
                    { opacity: 1, offset: 0.5 },
                    { opacity: 0 }
                ], { duration: 3000, easing: 'ease', fill: 'forwards' });
            }

            const sw = data.screenWidth;
            const sh = data.screenHeight;
            const monitors = Array.isArray(data.monitors) && data.monitors.length > 0
                ? data.monitors
                : [{ x: 0, y: 0, width: sw, height: sh }];

            for (const monitor of monitors) {
                addZone(monitor.x, monitor.y, monitor.width, monitor.height, 'zone-monitor');
            }

            if (Array.isArray(data.stopZones)) {
                const disabled = data.stopZonesEnabled === false;
                data.stopZones.forEach((zone, index) => {
                    let cls = 'zone-custom';
                    if (zone.action === 'pause') cls = 'zone-pause';
                    else if (zone.action === 'start') cls = 'zone-start';
                    if (disabled) cls += ' zone-disabled';
                    addZone(zone.x, zone.y, zone.width, zone.height, cls, String(index + 1));
                });
            }

            for (const monitor of monitors) {
                renderMonitorZones(monitor, data);
            }

            if (!hasFadedIn) {
                hasFadedIn = true;
                zoneLayer.animate([
                    { opacity: 0 },
                    { opacity: 1 }
                ], { duration: 250, easing: 'ease' });
            }
        }

        function renderMonitorZones(monitor, data) {
            if (data.edgeStopEnabled) {
                const cTL = data.cornerStopEnabled ? data.cornerStopTL : 0;
                const cTR = data.cornerStopEnabled ? data.cornerStopTR : 0;
                const cBL = data.cornerStopEnabled ? data.cornerStopBL : 0;
                const cBR = data.cornerStopEnabled ? data.cornerStopBR : 0;

                addZone(
                    monitor.x + cTL,
                    monitor.y,
                    monitor.width - cTL - cTR,
                    data.edgeStopTop,
                    'zone-edge'
                );
                addZone(
                    monitor.x + cBL,
                    monitor.y + monitor.height - data.edgeStopBottom,
                    monitor.width - cBL - cBR,
                    data.edgeStopBottom,
                    'zone-edge'
                );
                addZone(
                    monitor.x,
                    monitor.y + cTL,
                    data.edgeStopLeft,
                    monitor.height - cTL - cBL,
                    'zone-edge'
                );
                addZone(
                    monitor.x + monitor.width - data.edgeStopRight,
                    monitor.y + cTR,
                    data.edgeStopRight,
                    monitor.height - cTR - cBR,
                    'zone-edge'
                );
            }

            if (data.cornerStopEnabled) {
                addZone(monitor.x, monitor.y, data.cornerStopTL, data.cornerStopTL, 'zone-corner');
                addZone(
                    monitor.x + monitor.width - data.cornerStopTR,
                    monitor.y,
                    data.cornerStopTR,
                    data.cornerStopTR,
                    'zone-corner'
                );
                addZone(
                    monitor.x,
                    monitor.y + monitor.height - data.cornerStopBL,
                    data.cornerStopBL,
                    data.cornerStopBL,
                    'zone-corner'
                );
                addZone(
                    monitor.x + monitor.width - data.cornerStopBR,
                    monitor.y + monitor.height - data.cornerStopBR,
                    data.cornerStopBR,
                    data.cornerStopBR,
                    'zone-corner'
                );
            }
        }

        function addZone(x, y, w, h, cls, label) {
            const scale = window.devicePixelRatio || 1;
            x = x / scale;
            y = y / scale;
            w = w / scale;
            h = h / scale;
            
            if (w <= 0 || h <= 0) return null;
            const div = document.createElement('div');
            div.className = 'zone ' + cls;
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            div.style.width = w + 'px';
            div.style.height = h + 'px';
            if (label !== undefined) {
                div.classList.add('zone--labeled');
                const span = document.createElement('span');
                span.className = 'zone-label';
                span.textContent = label;
                const maxPx = 160;
                const fitPx = Math.min(w, h) * 0.65 / (1 + Math.max(0, label.length - 1) * 0.2);
                span.style.fontSize = Math.min(fitPx, maxPx) + 'px';
                div.appendChild(span);
            }
            zoneLayer.appendChild(div);
            return div;
        }

        function renderStopZonePreview(data) {
            if (!data || !stopZonePickModeActive) return;

            if (
                Number.isFinite(data.x) &&
                Number.isFinite(data.y) &&
                Number.isFinite(data.width) &&
                Number.isFinite(data.height)
            ) {
                const existing = document.getElementById('stop-zone-preview');
                if (existing) existing.remove();
                const preview = addZone(data.x, data.y, data.width, data.height, 'zone-drawing-preview');
                if (preview) preview.id = 'stop-zone-preview';
            }

            if (Number.isFinite(data.cursorX) && Number.isFinite(data.cursorY)) {
                updateFloatingPrompt(stopZonePrompt, data.cursorX, data.cursorY);
            }
        }

        function clearStopZonePreview() {
            const existing = document.getElementById('stop-zone-preview');
            if (existing) existing.remove();
            stopZonePrompt.classList.remove('active');
        }

        function renderClickPoints(data) {
            clickPointsLayer.innerHTML = '';
            clickPointsLayer.classList.remove('fade-out');

            if (!data || !Array.isArray(data.points)) return;

            for (let index = 0; index < data.points.length; index += 1) {
                const point = data.points[index];
                addClickPointDot(point, index);
            }

            if (!data.persistent && !pickModeActive) {
                void clickPointsLayer.offsetWidth;
                clickPointsLayer.classList.add('fade-out');
            }
        }

        function addClickPointDot(point, index) {
            const scale = window.devicePixelRatio || 1;
            const color = stableDotColor(point, index);

            if (point.radius > 0) {
                const circle = document.createElement('div');
                circle.className = 'click-points-radius';
                const diameter = (point.radius / scale) * 2;
                circle.style.width = diameter + 'px';
                circle.style.height = diameter + 'px';
                circle.style.left = (point.x / scale - point.radius / scale) + 'px';
                circle.style.top = (point.y / scale - point.radius / scale) + 'px';
                circle.style.borderColor = color;
                clickPointsLayer.appendChild(circle);
            }

            const dot = document.createElement('div');
            dot.className = 'click-points-dot';
            dot.style.left = (point.x / scale - 5) + 'px';
            dot.style.top = (point.y / scale - 5) + 'px';
            dot.style.background = color;
            clickPointsLayer.appendChild(dot);
        }

        function ptColor(value, fallback) {
            return typeof value === 'string' && /^#[0-9a-fA-F]{6}$/.test(value) ? value : fallback;
        }

        function ptNum(value) {
            return typeof value === 'number' && Number.isFinite(value) ? value : null;
        }

        function ptEl(className, styles, text) {
            const el = document.createElement('div');
            el.className = className;
            Object.assign(el.style, styles);
            if (text !== undefined) el.textContent = text;
            pixelTriggerLayer.appendChild(el);
            return el;
        }

        function renderPixelTrigger(data) {
            pixelTriggerLayer.innerHTML = '';
            if (!data || typeof data !== 'object') return;

            const scale = window.devicePixelRatio || 1;
            const ox = ptNum(data.originX) || 0;
            const oy = ptNum(data.originY) || 0;
            const X = (v) => (v - ox) / scale;
            const Y = (v) => (v - oy) / scale;
            const GAP = 4; // css px between sampled row and drawn stroke
            const matched = Boolean(data.matched);

            const line = data.line;
            if (data.mode === 'line' && line) {
                const x1 = ptNum(line.x1), x2 = ptNum(line.x2);
                const ay = ptNum(line.anchorY), cy = ptNum(line.checkY);
                if (x1 !== null && x2 !== null && ay !== null && cy !== null && x1 !== x2) {
                    const left = X(Math.min(x1, x2));
                    const right = X(Math.max(x1, x2)) + 1 / scale;
                    const width = right - left;
                    const bands = [
                        [ay, ptColor(line.anchorColor, '#ffffff'), 'A'],
                        [cy, ptColor(line.checkColor, '#06c105'), 'B'],
                    ];
                    for (const [y, color, label] of bands) {
                        const top = Y(y);
                        ptEl('pt-stroke', { left: left + 'px', top: (top - GAP - 2) + 'px', width: width + 'px', background: color });
                        ptEl('pt-stroke', { left: left + 'px', top: (top + GAP + 1 / scale) + 'px', width: width + 'px', background: color });
                        ptEl('pt-label', { left: (left - 26) + 'px', top: top + 'px' }, label);
                    }
                    const minY = Y(Math.min(ay, cy)) - GAP - 10;
                    const maxY = Y(Math.max(ay, cy)) + GAP + 10;
                    for (const x of [left - 2, right]) {
                        ptEl('pt-cap', { left: (x - 1) + 'px', top: minY + 'px', height: (maxY - minY) + 'px' });
                    }
                    const anchorX = ptNum(data.anchorX);
                    if (anchorX !== null) {
                        const tickColor = matched ? 'rgb(34, 200, 70)' : 'rgb(255, 150, 0)';
                        ptEl('pt-tick', { left: (X(anchorX) - 6) + 'px', top: (minY - 8) + 'px', borderTop: '8px solid ' + tickColor });
                        ptEl('pt-tick', { left: (X(anchorX) - 6) + 'px', top: maxY + 'px', borderBottom: '8px solid ' + tickColor });
                    }
                    ptEl('pt-status' + (matched ? ' on' : ''), { left: (right + 10) + 'px', top: ((minY + maxY) / 2) + 'px' }, matched ? 'MATCH' : 'no match');
                }
            }

            if (data.mode === 'points' && Array.isArray(data.points)) {
                data.points.forEach((p, i) => {
                    const x = ptNum(p && p.x), y = ptNum(p && p.y);
                    if (x === null || y === null) return;
                    const ring = p.matched ? 'rgb(34, 200, 70)' : ptColor(p.color, '#ffffff');
                    ptEl('pt-ring', { left: (X(x) - 9) + 'px', top: (Y(y) - 9) + 'px', borderColor: ring });
                    ptEl('pt-label', { left: (X(x) + 12) + 'px', top: Y(y) + 'px' }, (p.negate ? '!' : '') + (i + 1));
                });
            }

            if (Array.isArray(data.actions)) {
                data.actions.forEach((a, i) => {
                    const x = ptNum(a && a.x), y = ptNum(a && a.y);
                    if (x === null || y === null) return;
                    ptEl('pt-click', { left: (X(x) - 11) + 'px', top: (Y(y) - 11) + 'px' });
                    const delay = ptNum(a.delayMs);
                    ptEl('pt-label', { left: (X(x) + 16) + 'px', top: (Y(y) - 14) + 'px' }, 'Click ' + (i + 1) + (delay ? ' · ' + delay + ' ms' : ''));
                });
            }

            if (Array.isArray(data.recast)) {
                data.recast.forEach((step) => {
                    const x = ptNum(step && step.x), y = ptNum(step && step.y);
                    if (x === null || y === null) return;
                    ptEl('pt-click pt-recast', { left: (X(x) - 11) + 'px', top: (Y(y) - 11) + 'px' });
                    const index = ptNum(step.index) || 0;
                    const button = typeof step.button === 'string' ? step.button.slice(0, 6) : '';
                    const delay = ptNum(step.delayMs);
                    ptEl('pt-label', { left: (X(x) + 16) + 'px', top: (Y(y) - 14) + 'px' },
                        'Recast ' + index + ' · ' + button + (delay ? ' · ' + delay + ' ms' : ''));
                });
            }
        }

        function stableDotColor(point, index) {
            const key = point.id || `${index}:${point.x}:${point.y}`;
            let hash = 0;

            for (let i = 0; i < key.length; i += 1) {
                hash = ((hash << 5) - hash + key.charCodeAt(i)) | 0;
            }

            const hue = Math.abs(hash) % 360;
            return `hsl(${hue} 84% 58%)`;
        }

        function setPickMode(active) {
            pickModeActive = active;
            pickPrompt.classList.toggle('active', active);
            if (active) {
                clickPointsLayer.classList.remove('fade-out');
            }
        }

        function setStopZonePickMode(active) {
            stopZonePickModeActive = active;
            stopZonePrompt.classList.toggle('active', active);
            if (active) {
                if (zoneFadeAnim) {
                    zoneFadeAnim.cancel();
                    zoneFadeAnim = null;
                }
            } else {
                clearStopZonePreview();
            }
        }

        function updatePickPrompt(point) {
            if (!point || !pickModeActive) return;

            updateFloatingPrompt(pickPrompt, point.x, point.y);
        }

        function updateFloatingPrompt(prompt, rawX, rawY) {
            const scale = window.devicePixelRatio || 1;
            const gap = 18;
            const x = rawX / scale + gap;
            const y = rawY / scale + gap;
            const maxX = Math.max(0, window.innerWidth - prompt.offsetWidth - 8);
            const maxY = Math.max(0, window.innerHeight - prompt.offsetHeight - 8);

            prompt.style.left = Math.min(Math.max(8, x), maxX) + 'px';
            prompt.style.top = Math.min(Math.max(8, y), maxY) + 'px';
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setupTauriListener);
        } else {
            setupTauriListener();
        }
    </script>
</body>
</html>
